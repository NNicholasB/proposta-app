spring:
  application:
    name: proposta-app
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/propostadb
    password: 123
    username: postgres
  rabbitmq:
    host: host.docker.internal
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

rabbitmq:
  propostapendente:
    exchange: proposta-pendente.ex
  propostaconcluida:
    exchange: proposta-concluida.ex
  queue:
    proposta:
      concluida: proposta-concluida.ms-proposta
      pendente: proposta-pendente.ms-analise-credito